# Build Stream Studio on Windows, macOS and Linux and publish a GitHub Release.
#
#   git tag v1.7.0 && git push origin v1.7.0      # normal release
#   (or Actions tab -> "Release" -> Run workflow)  # rebuild an existing tag
#
# Assets uploaded (names are load-bearing: the in-app updater looks them up,
# see update_asset_name() in app.py):
#   StreamStudio-Setup.exe
#   StreamStudio-macos-arm64.tar.gz
#   StreamStudio-linux-x64.tar.gz
# Release notes = the matching "## <version>" section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.7.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: StreamStudio-${{ runner.os }}
          path: |
            Setup/StreamStudio-Setup.exe
            Setup/StreamStudio-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          awk -v ver="$VER" '
            $0 ~ "^## " ver "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          files: artifacts/*
